name: Desktop

on:
  push:
  pull_request:

permissions:
  contents: read

# Модель NER и языки OCR в CI не скачиваются: тесты, которым они нужны,
# пропускаются. Все остальные тесты используют синтетические документы.

jobs:
  test:
    # contents: write нужен только шагу публикации релиза (см. ниже).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Build
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean md_blinder.spec

      - name: Self-check of the built app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MD Blinder\MD Blinder.exe" -ArgumentList "--self-check" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\md-blinder\self-check.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: md-blinder-windows
          path: dist/MD Blinder
          retention-days: 14

      # Новая версия в md_blinder/__init__.py выпускается автоматически: если
      # релиза desktop-v<версия> еще нет, он создается из этого коммита.
      # Настольная программа находит его через API релизов и предлагает обновиться.
      - name: Publish release for a new version
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import md_blinder; print(md_blinder.__version__)"
          $tag = "desktop-v$version"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Релиз $tag уже есть"; exit 0 }
          Compress-Archive -Path "dist\MD Blinder\*" -DestinationPath "md-blinder-windows.zip"
          $hash = (Get-FileHash "md-blinder-windows.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "md-blinder-windows.zip.sha256" -Value "$hash  md-blinder-windows.zip" -NoNewline -Encoding ascii
          $notes = "Настольная версия MD Blinder $version для Windows. Обновление ставится из программы; первая установка — распаковать архив в свою папку и запустить MD Blinder.exe."
          gh release create $tag md-blinder-windows.zip md-blinder-windows.zip.sha256 `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "MD Blinder Desktop $version" --notes "$notes"
