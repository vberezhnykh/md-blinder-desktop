[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "md-blinder-desktop"
dynamic = ["version"]
description = "Настольная версия MD Blinder: DOCX/XLSX/PDF в Markdown и обезличивание"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PySide6>=6.8",
  "pymupdf>=1.28.2",
  # Модель разметки страницы для поиска таблиц в PDF; версия совпадает с pymupdf.
  "pymupdf-layout>=1.28.2",
  "mammoth>=1.9",
  "openpyxl>=3.1",
  "markdownify>=1.1",
  "beautifulsoup4>=4.12",
  # На Windows — сборка с DirectML: NER считается на видеокарте, если она проходит
  # калибровку, иначе на CPU (ner/engine.py). pymupdf-layout тянет обычный onnxruntime,
  # который затирает файлы DirectML: build.bat и CI переставляют onnxruntime-directml.
  "onnxruntime>=1.20; sys_platform != 'win32'",
  "onnxruntime-directml>=1.24; sys_platform == 'win32'",
  "tokenizers>=0.20",
  "numpy>=2.0",
  "regex>=2024.1",
  "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10"]

[project.gui-scripts]
md-blinder = "md_blinder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "md_blinder.__version__"}

[tool.setuptools.package-data]
md_blinder = ["ui/assets/fonts/*", "anonymize/*.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "model: нужен скачанный файл модели GLiNER",
  "tessdata: нужны языковые файлы Tesseract",
]
