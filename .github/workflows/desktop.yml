name: Desktop

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

# Модель NER и языки OCR в CI не скачиваются: тесты, которым они нужны,
# пропускаются. Все остальные тесты используют синтетические документы.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Qt system libraries
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Build
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean md_blinder.spec

      - name: Upload build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: md-blinder-windows
          path: desktop/dist/MD Blinder
          retention-days: 14
