name: NER benchmark

# Ручной замер скорости и точности вариантов сессии NER на настоящей модели
# (scripts/bench_ner.py). В обычный CI не входит: модель там не скачивается.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/bench_ner.py", ".github/workflows/ner-bench.yml"]

permissions:
  contents: read

env:
  REV: 6ddaeb9413b0e71ad8457da1aab378a165b24058
  PYTHONUTF8: "1"

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        with:
          path: model
          key: gliner-multi-v2.1-${{ env.REV }}-fp16-fp32

      - name: Download model
        shell: bash
        run: |
          mkdir -p model
          base="https://huggingface.co/onnx-community/gliner_multi-v2.1/resolve/$REV"
          for f in tokenizer.json tokenizer_config.json onnx/model_fp16.onnx onnx/model.onnx; do
            out="model/$(basename "$f")"
            [ -s "$out" ] || curl -fsSL --retry 3 -o "$out" "$base/$f"
          done
          ls -l model

      - name: Install
        run: python -m pip install -e . onnx

      - name: Benchmark (CPU)
        shell: bash
        run: |
          python scripts/bench_ner.py --model-dir model --out bench-${{ runner.os }}.json | tee bench.log
          grep '^|' bench.log >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark (DirectML, WARP без видеокарты)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          python -m pip uninstall -y onnxruntime
          python -m pip install onnxruntime-directml
          python scripts/bench_ner.py --model-dir model --only dml --repeat 1 \
            --baseline bench-Windows.json --out bench-Windows-dml.json | tee dml.log
          grep '^|' dml.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-${{ runner.os }}
          path: bench-*.json
